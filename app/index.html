<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Clearmind</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">clearmind<i></i></div>
        <div class="model" id="model"></div>
        <button class="insp" data-act="inspector" title="Recall details, latency, credits and eval">Inspector</button>
        <button class="credits rcred" id="rcredPill" data-act="rcredits" title="Live web research credits (Tavily) for today">Research credits</button>
        <button class="credits" id="creditsPill" data-act="inspector" title="Demo credits (not real money). Opens the Inspector."></button>
      </header>
      <main class="canvas">
        <nav class="notch" id="tabs" role="tablist"></nav>
        <section class="content" id="content"></section>
        <form class="dock" id="composer" autocomplete="off">
          <input id="q" placeholder="Ask your memory..." aria-label="Ask" />
          <button class="send" type="submit" aria-label="Send">&#10148;</button>
        </form>
      </main>
    </div>
    <aside class="drawer" id="drawer"></aside>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
