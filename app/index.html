<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Clearmind</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%276%27 fill=%27%23B8EFA8%27/%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">clearmind<i></i></div>
        <div class="model" id="model"></div>

        <nav class="notch" id="tabs" role="tablist"></nav>

          <input id="q" placeholder="Ask your memory... e.g. What time is my standup?" aria-label="Ask" />
          <button class="send" type="submit" aria-label="Send">&#10148;</button>
        </form>
      </main>
    </div>
    <aside class="drawer" id="drawer"></aside>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
